name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: engine/go.sum
      - name: vet
        working-directory: engine
        run: go vet ./...
      - name: test
        working-directory: engine
        run: go test ./...
